<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Career Flow AI</title>
    <script>
      // GitHub Pages serves this page for any path that isn't a real file
      // (e.g. /Career-Flow-AI/app/emails). Rewrite the path into the hash
      // (#/app/emails) that HashRouter understands, then load index.html.
      (function () {
        var base = "/Career-Flow-AI";
        var path = window.location.pathname;
        if (path.indexOf(base + "/") === 0) {
          window.location.replace(base + "/#/" + path.slice(base.length + 1));
        } else {
          window.location.replace(base + "/#/");
        }
      })();
    </script>
  </head>
  <body>
    <p>Redirecting…</p>
  </body>
</html>
